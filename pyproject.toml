[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexgraph"
version = "0.1.0"
description = "Swiss Legal Agent: LangGraph agent for Swiss employment and tenancy law. University prototype, not legal advice."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["lexgraph*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "index"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
